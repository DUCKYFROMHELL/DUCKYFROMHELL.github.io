<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고성군 소식 1999-01-01</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: #eef1f2; color: #1f2733;
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  line-height: 1.6; word-break: keep-all;
}
.wrap { max-width: 720px; margin: 0 auto; background: #fff; min-height: 100vh; }
header {
  background: linear-gradient(135deg, #12303a 0%, #1c4a55 100%);
  color: #fff; padding: 26px 20px;
}
header .kicker { font-size: 11px; letter-spacing: 2.5px; color: #8fd0c6; font-weight: 600; }
header h1 { margin: 8px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.5px; }
header .meta {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.2);
  font-size: 13px; color: #cfe6e1;
}
main { padding: 22px 20px 8px; }
.board { margin-bottom: 26px; }
.board > h2 {
  margin: 0 0 12px; padding-bottom: 8px;
  border-bottom: 2px solid #2f8f83;
  font-size: 15px; font-weight: 700;
}
.board > h2 .count { margin-left: 6px; color: #7b8494; font-size: 12px; font-weight: 500; }
article { padding: 14px 0; border-bottom: 1px solid #e7eaf0; }
article:last-child { border-bottom: 0; }
article h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; }
article h3 a { color: #1f2733; text-decoration: none; }
article h3 a:hover { text-decoration: underline; }
.dept { margin: 4px 0 0; color: #7b8494; font-size: 12px; }
.excerpt { margin: 8px 0 0; color: #45505f; font-size: 14px; }
.files { margin: 10px 0 0; padding: 0; list-style: none; }
.files li { margin-top: 4px; font-size: 13px; }
.files a { color: #2f8f83; text-decoration: none; }
.files .size { color: #9aa3b0; font-size: 12px; }
.empty { margin: 0; padding: 14px; background: #f6f8f8; border: 1px solid #e7eaf0;
         border-radius: 4px; color: #7b8494; font-size: 14px; }
footer { padding: 18px 20px; background: #f6f8f8; border-top: 1px solid #e7eaf0;
         color: #7b8494; font-size: 12px; line-height: 1.7; }
footer a { color: #2f8f83; text-decoration: none; }
@media (prefers-color-scheme: dark) {
  body { background: #14181d; color: #e6e9ee; }
  .wrap { background: #1b2027; }
  article h3 a { color: #e6e9ee; }
  .excerpt { color: #b3bcc8; }
  article, .board > h2 { border-color: #2a313a; }
  .empty { background: #202730; border-color: #2a313a; }
  footer { background: #202730; border-color: #2a313a; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">GOSEONG DAILY</div>
    <h1>🌾 고성군 소식</h1>
    <div class="meta">1999년 01월 01일 (금) · 총 0건</div>
  </header>

  <main>
    <section class="board">
      <h2>📰 보도자료<span class="count">0건</span></h2>
      <p class="empty">새 글 없음</p>
    </section>
  </main>

  <footer>
    고성군청 <a href="https://www.goseong.go.kr">누리집</a>에서 자동 수집·발행되었습니다.
    제목을 누르면 원문으로 이동합니다.<br>
    <a href="../">지난 소식 보기</a> · 발행 2026-08-06 16:31
  </footer>
</div>
</body>
</html>
